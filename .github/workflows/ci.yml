name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          CHUNKD_REQUIRE_JAVA_TEST: '1'
      - name: Build Linux daemon without CGO
        run: CGO_ENABLED=0 go build -trimpath -o bin/chunkd ./cmd/chunkd
      - uses: actions/upload-artifact@v4
        with:
          name: chunkd-linux
          path: bin/chunkd
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: chunkd-web
          path: web/dist
